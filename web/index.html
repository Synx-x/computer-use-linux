  <div class="content">
    <header class="top">
      <div class="brand"><b>AGENT DESKTOPS</b><span id="brand-host">HYPRLAND</span></div>
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="v-wall" aria-pressed="true">Wall</button>
        <button type="button" id="v-focus" aria-pressed="false">Focus</button>
      </div>
      <div class="tools">
        <span class="count"><span class="dot live"></span><span id="live-n">0</span>&nbsp;live</span>
        <span class="count needs"><span class="dot needs"></span><span id="needs-n">0</span>&nbsp;needs you</span>
        <button type="button" class="pill" id="new">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New desktop
        </button>
        <button type="button" class="gear" id="gear" aria-label="Settings" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        </button>
      </div>
    </header>
    <main id="main" style="flex:1;display:flex;flex-direction:column;min-height:0"></main>
  </div>

  <div class="overlay" role="dialog" aria-modal="true" aria-label="Settings" aria-hidden="true">
    <div class="bar"><span>AGENT DESKTOPS · CONFIG</span><button type="button" class="pill accent" id="done">Done</button></div>
    <div class="panel">
      <div style="display:flex;flex-direction:column;gap:8px">
        <span class="eyebrow">THEME</span>
        <h2 class="big">Settings</h2>
        <p class="lede">Changes apply to the whole page as you pick them. The sky stays behind everything.</p>
      </div>
      <section aria-labelledby="set-glass">
        <div><h3 id="set-glass">Glass</h3><p>How much of the sky shows through the top bar, tiles and side panel.</p></div>
        <div class="opts" role="radiogroup" aria-labelledby="set-glass" id="glass-opts"></div>
      </section>
      <section aria-labelledby="set-sky">
        <div><h3 id="set-sky">Sky</h3><p>Let the stars turn, or hold them still.</p></div>
        <div class="seg" role="radiogroup" aria-labelledby="set-sky" id="sky-opts" style="width:fit-content;gap:4px"></div>
      </section>
    </div>
  </div>
</div>
